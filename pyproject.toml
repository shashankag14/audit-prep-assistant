[project]
name = "audit-prep-assistant"
version = "0.1.0"
description = "Builds an audit attention brief: what deserves an auditor's attention before a surveillance audit, and why."
readme = "README.md"
authors = [{ name = "Shashank Agarwal", email = "shashankag14@gmail.com" }]
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7,<3",
    "rapidocr-onnxruntime>=1.3",
    "llama-cpp-python>=0.3.16",
    "huggingface-hub>=0.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "ruff>=0.6",
]

[project.scripts]
audit-prep = "audit_prep.cli:main"

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/audit_prep"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

# llama-cpp-python: prebuilt CPU wheels, so Windows/macOS/Linux install without a C++ compiler.
[[tool.uv.index]]
name = "llama-cpp-cpu"
url = "https://abetlen.github.io/llama-cpp-python/whl/cpu"
explicit = true

[tool.uv.sources]
llama-cpp-python = { index = "llama-cpp-cpu" }
